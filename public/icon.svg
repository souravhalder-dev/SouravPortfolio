<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="34" fill="url(#iconGradient)" />
  <rect x="2" y="2" width="124" height="124" rx="32" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <!-- Modern Clean Stylized S -->
  <text 
    x="64" 
    y="93" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="86" 
    font-weight="900" 
    fill="#ffffff"
    letter-spacing="-2px"
    filter="url(#softGlow)"
  >S</text>
  <!-- Futuristic accent dot -->
  <circle cx="94" cy="34" r="6" fill="#38bdf8" />
</svg>
